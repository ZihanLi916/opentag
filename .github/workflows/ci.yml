name: Billing checkout diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-v7:
    name: Diagnose private checkout v7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify current secret can read the exact pinned commit
        id: billing
        env:
          GH_TOKEN: ${{ secrets.OPENTAG_BILLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          REVISION=$(node scripts/cloud-billing-pin.mjs)
          ACTUAL=$(gh api "repos/first-tree-ai/opentag-billing/commits/$REVISION" --jq .sha)
          test "$ACTUAL" = "$REVISION"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
      - name: Check out pinned private package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: first-tree-ai/opentag-billing
          ref: ${{ steps.billing.outputs.revision }}
          token: ${{ secrets.OPENTAG_BILLING_READ_TOKEN }}
          path: .cloud-billing
          persist-credentials: false
      - name: Verify checkout and credential cleanup
        env:
          REVISION: ${{ steps.billing.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C .cloud-billing rev-parse HEAD)" = "$REVISION"
          if git -C .cloud-billing config --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo 'Private checkout credentials remain configured' >&2
            exit 1
          fi
  checkout-v5:
    name: Diagnose private checkout v5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify current secret can read the exact pinned commit
        id: billing
        env:
          GH_TOKEN: ${{ secrets.OPENTAG_BILLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          REVISION=$(node scripts/cloud-billing-pin.mjs)
          ACTUAL=$(gh api "repos/first-tree-ai/opentag-billing/commits/$REVISION" --jq .sha)
          test "$ACTUAL" = "$REVISION"
          printf 'revision=%s\n' "$REVISION" >> "$GITHUB_OUTPUT"
      - name: Check out pinned private package
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: first-tree-ai/opentag-billing
          ref: ${{ steps.billing.outputs.revision }}
          token: ${{ secrets.OPENTAG_BILLING_READ_TOKEN }}
          path: .cloud-billing
          persist-credentials: false
      - name: Verify checkout and credential cleanup
        env:
          REVISION: ${{ steps.billing.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git -C .cloud-billing rev-parse HEAD)" = "$REVISION"
          if git -C .cloud-billing config --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo 'Private checkout credentials remain configured' >&2
            exit 1
          fi
